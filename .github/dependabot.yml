version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      nuxt:
        patterns:
          - 'nuxt'
          - '@nuxt/*'
          - '@nuxtjs/*'
          - 'nitropack'
      vue:
        patterns:
          - 'vue'
          - 'vue-*'
          - '@vue/*'
          - 'pinia'
          - '@pinia/*'
      ai-stack:
        patterns:
          - '@anthropic-ai/*'
          - '@modelcontextprotocol/*'
      supabase:
        patterns:
          - '@supabase/*'
          - '@nuxtjs/supabase'
      dev-tooling:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint'
          - 'eslint-*'
          - '@nuxt/eslint'
        # Group only minor + patch. Majors arrive as individual PRs so each
        # can be evaluated for breaking changes (peer-dep coordination,
        # vue-tsc support, engines range, etc). See docs/issues.md #18.
        update-types:
          - minor
          - patch
    ignore:
      # Major Nuxt upgrades are coordinated manually
      - dependency-name: 'nuxt'
        update-types: ['version-update:semver-major']
      # @types/node major must track the engines range (package.json: node
      # >=22 <25 → Node 24 types). Bump manually when the Node range moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) drops the ./lib/tsc subpath export that
      # vue-tsc / nuxt typecheck still require (ERR_PACKAGE_PATH_NOT_EXPORTED,
      # PR #23). Revisit when vue-tsc/Nuxt support TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # pinia 4 / @pinia/nuxt 1.0 ship types the Nuxt 3 toolchain can't
      # resolve (TS7016 in typecheck, PR #25). Coordinate with a Nuxt major
      # upgrade instead of taking these standalone.
      - dependency-name: 'pinia'
        update-types: ['version-update:semver-major']
      - dependency-name: '@pinia/nuxt'
        update-types: ['version-update:semver-major']
      # h3 v2 / @nuxt/schema v4 belong to Nuxt 4; on Nuxt 3 they break the
      # build (toWebRequest removed) and typecheck (PR #35). Pinned as direct
      # deps only to stop @nuxt/eslint's copies hoisting. Move with the Nuxt major.
      - dependency-name: 'h3'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/schema'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
